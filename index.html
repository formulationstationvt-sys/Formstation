
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Active Work Orders – Supply Check</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }
  header { background: #1a1f2e; border-bottom: 1px solid #2d3748; padding: 18px 28px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 1.3rem; font-weight: 700; color: #fff; }
  header .sub { font-size: 0.8rem; color: #718096; margin-top: 2px; }
  .live-badge { background: #1a3a1a; border: 1px solid #2d7a2d; border-radius: 20px; padding: 4px 12px; font-size: 0.72rem; font-weight: 600; color: #68d391; display: flex; align-items: center; gap: 6px; }
  .live-dot { width: 7px; height: 7px; background: #68d391; border-radius: 50%; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .refresh-btn { background: #2d3748; border: 1px solid #4a5568; color: #a0aec0; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.78rem; margin-left: auto; transition: all 0.15s; }
  .refresh-btn:hover { background: #3182ce; border-color: #3182ce; color: #fff; }
  .loading-wrap { padding: 60px; text-align: center; color: #718096; font-size: 0.9rem; }
  .spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid #2d3748; border-top-color: #3182ce; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 14px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .err { background: #3d1515; border: 1px solid #c53030; color: #fc8181; padding: 14px 28px; font-size: 0.84rem; display: none; line-height: 1.7; }
  .controls { display: flex; gap: 10px; padding: 16px 28px; background: #141824; border-bottom: 1px solid #1e2535; flex-wrap: wrap; align-items: center; }
  .filter-btn { background: #1e2535; border: 1px solid #2d3748; color: #a0aec0; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 500; transition: all 0.15s; }
  .filter-btn:hover,.filter-btn.active { background: #3182ce; border-color: #3182ce; color: #fff; }
  .search { background: #1e2535; border: 1px solid #2d3748; color: #e2e8f0; padding: 6px 14px; border-radius: 6px; font-size: 0.8rem; width: 200px; outline: none; }
  .search:focus { border-color: #3182ce; }
  .search::placeholder { color: #4a5568; }
  #issuesBtn.active { background: #c53030; border-color: #c53030; color: #fff; }
  .summary-bar { display: flex; gap: 20px; padding: 12px 28px; background: #1a1f2e; border-bottom: 1px solid #2d3748; flex-wrap: wrap; align-items: center; }
  .stat-box .n { font-size: 1.4rem; font-weight: 700; color: #fff; }
  .stat-box .l { font-size: 0.7rem; color: #718096; text-transform: uppercase; letter-spacing: 0.04em; }
  .stat-box.g .n { color: #68d391; }
  .stat-box.r .n { color: #fc8181; }
  .stat-box.y .n { color: #f6ad55; }
  .div { width: 1px; background: #2d3748; align-self: stretch; min-height: 30px; }
  .table-wrap { padding: 20px 28px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  thead th { background: #1a1f2e; color: #718096; font-weight: 600; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.05em; padding: 10px 12px; text-align: left; border-bottom: 1px solid #2d3748; white-space: nowrap; }
  tbody tr.dr { border-bottom: 1px solid #1e2535; cursor: pointer; transition: background 0.1s; }
  tbody tr.dr:hover { background: #1a1f2e; }
  td { padding: 11px 12px; vertical-align: middle; }
  td.wo { font-weight: 700; color: #63b3ed; white-space: nowrap; }
  td.co { font-weight: 600; }
  td.pr { color: #cbd5e0; max-width: 220px; }
  td.pr span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill { display: inline-flex; padding: 3px 9px; border-radius: 12px; font-size: 0.72rem; font-weight: 600; white-space: nowrap; }
  .pp { background: #2c7a39; color: #9ae6b4; }
  .pv { background: #2a4365; color: #90cdf4; }
  .pt { background: #553c9a; color: #d6bcfa; }
  .pw { background: #744210; color: #fbd38d; }
  .po { background: #2d3748; color: #a0aec0; }
  .pgp { display: inline-flex; padding: 3px 9px; border-radius: 12px; font-size: 0.72rem; font-weight: 600; white-space: nowrap; }
  .pi  { background: #2d3748; color: #a0aec0; }
  .pw2 { background: #1a365d; color: #90cdf4; }
  .pg  { background: #3d2d0e; color: #fbd38d; }
  .pr2 { background: #1c4a1e; color: #9ae6b4; }
  .pte { background: #44337a; color: #d6bcfa; }
  .sc { display: flex; flex-direction: column; gap: 3px; }
  .sr { display: flex; align-items: center; gap: 5px; font-size: 0.72rem; }
  .sl { color: #718096; min-width: 44px; }
  .ok { color: #68d391; font-weight: 700; }
  .wn { color: #f6ad55; font-weight: 700; }
  .bd { color: #fc8181; font-weight: 700; }
  .na { color: #4a5568; }
  .detrow { display: none; }
  .detrow.open { display: table-row; }
  .detin { padding: 14px 20px 18px; display: flex; gap: 24px; flex-wrap: wrap; background: #141824; border-top: 1px solid #2d3748; }
  .ds h4 { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; color: #4a5568; margin-bottom: 7px; }
  .kv { display: flex; gap: 8px; font-size: 0.77rem; margin-bottom: 4px; }
  .kk { color: #718096; min-width: 88px; flex-shrink: 0; }
  .vv { color: #e2e8f0; word-break: break-all; }
  .ts { font-size: 0.72rem; color: #4a5568; padding: 6px 28px 10px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>⚗️ Active Work Orders — Supply Check</h1>
    <div class="sub">Formulation Station VT · MANU0035 · Live from Google Sheets</div>
  </div>
  <div class="live-badge"><span class="live-dot"></span>LIVE DATA</div>
  <button class="refresh-btn" onclick="loadAll()">↻ Refresh</button>
</header>

<div class="err" id="err"></div>

<div class="summary-bar">
  <div class="stat-box"><div class="n" id="sT">…</div><div class="l">Active WOs</div></div>
  <div class="div"></div>
  <div class="stat-box g"><div class="n" id="sO">…</div><div class="l">Supply OK</div></div>
  <div class="div"></div>
  <div class="stat-box r"><div class="n" id="sI">…</div><div class="l">Issues</div></div>
  <div class="div"></div>
  <div class="stat-box y"><div class="n" id="sTe">…</div><div class="l">Out for Testing</div></div>
</div>

<div class="controls">
  <button class="filter-btn active" onclick="setType(this,'all')">All</button>
  <button class="filter-btn" onclick="setType(this,'Pre Roll')">Pre Rolls</button>
  <button class="filter-btn" onclick="setType(this,'Vape')">Vape Carts</button>
  <button class="filter-btn" onclick="setType(this,'Tincture')">Tinctures</button>
  <button class="filter-btn" onclick="setType(this,'Water Soluble')">Water Soluble</button>
  <input class="search" id="srch" placeholder="Search WO, company, product…" oninput="render()">
  <button class="filter-btn" id="issuesBtn" onclick="toggleIssues()">⚠ Issues Only</button>
</div>

<div id="main">
  <div class="loading-wrap"><div class="spinner"></div><br>Loading live data from Google Sheets…</div>
</div>
<div class="ts" id="ts"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbw7yFCDaftpEGe45pgTvidCQ6lIU5L3DTMNoCtTsOa-ZVy0k2JPOLrtnCkLdUVYN0pcXQ/exec';

let allRows = [], typeFilter = 'all', issuesOnly = false;

async function loadAll() {
  document.getElementById('main').innerHTML =
    '<div class="loading-wrap"><div class="spinner"></div><br>Loading live data from Google Sheets…</div>';
  document.getElementById('err').style.display = 'none';
  ['sT','sO','sI','sTe'].forEach(id => document.getElementById(id).textContent = '…');

  try {
    const res = await fetch(API);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    process(data);
    document.getElementById('ts').textContent = 'Last refreshed: ' + new Date().toLocaleString();
  } catch(e) {
    document.getElementById('main').innerHTML = '';
    const eb = document.getElementById('err');
    eb.style.display = 'block';
    eb.innerHTML = '⚠ <strong>Could not load data:</strong> ' + e.message;
  }
}

function process(data) {
  const progress  = data['Storage and progress'] || [];
  const workOrders= data['Work Orders'] || [];
  const cnp       = data['Container and Packaging'] || [];
  const purchases  = data['CandP Purchases'] || [];
  const sales      = data['CandP Sales'] || [];
  const extracts   = data['Extract List'] || [];

  // Active = not completed
  const active = progress.filter(r => String(r['Progress'] || '').toLowerCase() !== 'completed');

  // Index WOs — handle numeric IDs (gviz returns 26.0 etc)
  const woMap = {};
  workOrders.forEach(r => {
    const id = String(r['WO-ID'] || '').replace(/\.0$/, '').trim();
    if (id) woMap[id] = r;
  });

  // C&P stock
  const cnpStock = {};
  cnp.forEach(r => {
    const id = String(r['CNP-ID'] || '').trim();
    if (!id) return;
    cnpStock[id] = {
      id, category: r['Category'] || '', color: r['Color'] || '',
      size: r['Size Container ML'] || '',
      stock: parseFloat(r['Initial Quantity in Stock']) || 0,
    };
  });
  purchases.forEach(r => {
    const id = String(r['CNP-ID'] || '').trim();
    const qty = parseFloat(r['Quantity Purchased '] || r['Quantity Purchased'] || 0);
    if (cnpStock[id]) cnpStock[id].stock += qty;
  });
  sales.forEach(r => {
    const id = String(r['CNP-ID'] || '').trim();
    const qty = parseFloat(r['Quantity Sold '] || r['Quantity Sold'] || 0);
    if (cnpStock[id]) cnpStock[id].stock -= qty;
  });

  // Extract index
  const extMap = {};
  extracts.forEach(r => {
    const lot = String(r['Extract Lot Number'] || '').trim().toLowerCase();
    if (lot) extMap[lot] = r;
  });

  allRows = active.map(sp => {
    const rawId = String(sp['Wo-id'] || sp['WO-ID'] || '').replace(/\.0$/, '').trim();
    const woId = 'WO-' + rawId;
    const wo = woMap[rawId] || woMap['WO-' + rawId] || {};

    const company     = String(wo['Company Name'] || sp['Company name'] || '');
    const productName = String(wo['Product Name - ex. 1g Sour Diesel Pre Roll.'] || sp['Product Name'] || '');
    const productType = String(wo['What kind of Project are we working on?'] || sp['What kind of Project are we working on?'] || '');
    const prog        = String(sp['Progress'] || '');

    const el1  = String(wo['Extract Lot Number']   || sp['Extract Lot Number']    || '').trim();
    const el2  = String(wo['Extract Lot Number ']  || sp['Extract Lot Number_11'] || '').trim();
    const tl1  = String(wo['Terpene Lot Number']   || sp['Terpene Lot Number']    || '').trim();
    const tl2  = String(wo['Terpene Lot Number 2'] || sp['Terpene Lot Number 2']  || '').trim();
    const cnpId= String(wo['Project Supplies']     || sp['Project Supplies']      || '').trim();

    const ei1 = el1 ? extMap[el1.toLowerCase()] : null;
    const ei2 = el2 ? extMap[el2.toLowerCase()] : null;
    const ti1 = tl1 ? extMap[tl1.toLowerCase()] : null;

    const es1 = ei1 ? (parseFloat(ei1['Current Stock Extract']) || 0) : null;
    const es2 = ei2 ? (parseFloat(ei2['Current Stock Extract']) || 0) : null;
    const ts1 = ti1 ? (parseFloat(ti1['Current Stock Terpene'])|| 0) : null;

    const ci  = cnpId ? cnpStock[cnpId] : null;
    const cq  = ci ? ci.stock : null;

    const hasIssue = (es1 !== null && es1 <= 0) || (es2 !== null && es2 <= 0) || (cq !== null && cq <= 50);
    return { woId, company, productName, productType, prog, el1, el2, tl1, tl2, es1, es2, ts1, cnpId, ci, cq, hasIssue };
  });

  updateStats();
  render();
}

function updateStats() {
  const t = allRows.length, i = allRows.filter(r => r.hasIssue).length;
  const te = allRows.filter(r => r.prog.toLowerCase().includes('testing')).length;
  document.getElementById('sT').textContent  = t;
  document.getElementById('sO').textContent  = t - i;
  document.getElementById('sI').textContent  = i;
  document.getElementById('sTe').textContent = te;
}

function typePill(t) {
  const c = t.includes('Pre Roll') ? 'pp' : t.includes('Vape')||t.includes('Cart') ? 'pv' : t.includes('Tincture') ? 'pt' : t.includes('Water') ? 'pw' : 'po';
  const l = t.includes('Pre Roll') ? '🌿 Pre Roll' : t.includes('Vape')||t.includes('Cart') ? '💨 Vape Cart' : t.includes('Tincture') ? '💊 Tincture' : t.includes('Water') ? '💧 Water Sol.' : t || 'Other';
  return '<span class="pill ' + c + '">' + l + '</span>';
}

function progPill(p) {
  const lp = p.toLowerCase();
  const c = lp.includes('intaken') ? 'pi' : lp.includes('weighed') ? 'pw2' : lp.includes('ground') ? 'pg' : lp.includes('rolled') ? 'pr2' : lp.includes('testing') ? 'pte' : 'pi';
  return '<span class="pgp ' + c + '">' + (p||'—') + '</span>';
}

function sv(q, unit) {
  if (q === null) return '<span class="na">—</span>';
  const c = q <= 0 ? 'bd' : q < 100 ? 'wn' : 'ok';
  return '<span class="' + c + '">' + Math.round(q) + ' ' + unit + '</span>';
}

function render() {
  const srch = document.getElementById('srch').value.toLowerCase();
  const f = allRows.filter(r => {
    if (typeFilter !== 'all' && !r.productType.includes(typeFilter)) return false;
    if (issuesOnly && !r.hasIssue) return false;
    if (srch && !(r.woId+r.company+r.productName+r.productType).toLowerCase().includes(srch)) return false;
    return true;
  });

  let h = '<div class="table-wrap"><table><thead><tr><th>WO #</th><th>Company</th><th>Product</th><th>Type</th><th>Progress</th><th>Extract Stock</th><th>C&P Supply</th></tr></thead><tbody>';

  if (!f.length) {
    h += '<tr><td colspan="7" style="text-align:center;padding:40px;color:#4a5568">No work orders match your filters.</td></tr>';
  }

  f.forEach((r, i) => {
    const did = 'det' + i;
    const bdr = r.hasIssue ? 'border-left:3px solid #fc8181' : '';

    let ext = '<div class="sc">';
    if (r.el1) ext += '<div class="sr"><span class="sl">Ext 1:</span>' + sv(r.es1,'g') + '</div>';
    if (r.el2) ext += '<div class="sr"><span class="sl">Ext 2:</span>' + sv(r.es2,'g') + '</div>';
    if (r.tl1) ext += '<div class="sr"><span class="sl">Terp:</span>'  + sv(r.ts1,'g') + '</div>';
    if (!r.el1 && !r.tl1) ext += '<span class="na">No lots linked</span>';
    ext += '</div>';

    let cnpH = '<div class="sc">';
    if (r.cnpId && r.ci) {
      const lbl = [r.ci.category, r.ci.size?r.ci.size+'mL':'', r.ci.color].filter(Boolean).join(' ').slice(0,22);
      cnpH += '<div class="sr"><span class="sl" title="'+r.cnpId+'">'+lbl+'</span>' + sv(r.cq,'units') + '</div>';
    } else if (r.cnpId) {
      cnpH += '<div class="sr"><span class="sl">'+r.cnpId+'</span><span class="na">—</span></div>';
    } else {
      cnpH += '<span class="na">—</span>';
    }
    cnpH += '</div>';

    h += '<tr class="dr" style="'+bdr+'" onclick="tog(\''+did+'\')"><td class="wo">'+r.woId+'</td><td class="co">'+(r.company||'—')+'</td><td class="pr"><span title="'+r.productName+'">'+(r.productName||'—')+'</span></td><td>'+typePill(r.productType)+'</td><td>'+progPill(r.prog)+'</td><td>'+ext+'</td><td>'+cnpH+'</td></tr>';

    const lots = [
      r.el1 && '<div class="kv"><span class="kk">Extract Lot 1</span><span class="vv">'+r.el1+(r.es1!==null?' ('+Math.round(r.es1)+'g)':'')+'</span></div>',
      r.el2 && '<div class="kv"><span class="kk">Extract Lot 2</span><span class="vv">'+r.el2+(r.es2!==null?' ('+Math.round(r.es2)+'g)':'')+'</span></div>',
      r.tl1 && '<div class="kv"><span class="kk">Terpene Lot 1</span><span class="vv">'+r.tl1+(r.ts1!==null?' ('+Math.round(r.ts1)+'g)':'')+'</span></div>',
      r.tl2 && '<div class="kv"><span class="kk">Terpene Lot 2</span><span class="vv">'+r.tl2+'</span></div>',
    ].filter(Boolean).join('') || '<span class="na">No lots linked</span>';

    const cnpD = r.cnpId
      ? '<div class="kv"><span class="kk">CNP-ID</span><span class="vv">'+r.cnpId+'</span></div>'
        +(r.ci?'<div class="kv"><span class="kk">Type</span><span class="vv">'+r.ci.category+' '+(r.ci.size||'')+'mL '+r.ci.color+'</span></div>':'')
        +'<div class="kv"><span class="kk">Stock</span><span class="vv '+(r.cq<=0?'bd':r.cq<100?'wn':'ok')+'">'+(r.cq!==null?Math.round(r.cq)+' units':'—')+'</span></div>'
      : '<span class="na">No packaging linked</span>';

    h += '<tr class="detrow" id="'+did+'"><td colspan="7"><div class="detin"><div class="ds"><h4>Work Order</h4><div class="kv"><span class="kk">WO-ID</span><span class="vv">'+r.woId+'</span></div><div class="kv"><span class="kk">Company</span><span class="vv">'+r.company+'</span></div><div class="kv"><span class="kk">Product</span><span class="vv">'+r.productName+'</span></div><div class="kv"><span class="kk">Progress</span><span class="vv">'+r.prog+'</span></div></div><div class="ds"><h4>Extract / Terpene Lots</h4>'+lots+'</div><div class="ds"><h4>Container & Packaging</h4>'+cnpD+'</div></div></td></tr>';
  });

  h += '</tbody></table></div>';
  document.getElementById('main').innerHTML = h;
}

function tog(id) { const e = document.getElementById(id); if(e) e.classList.toggle('open'); }
function setType(btn, t) {
  typeFilter = t;
  document.querySelectorAll('.filter-btn:not(#issuesBtn)').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}
function toggleIssues() {
  issuesOnly = !issuesOnly;
  document.getElementById('issuesBtn').classList.toggle('active', issuesOnly);
  render();
}

loadAll();
</script>
</body>
</html>
